name: build

# Builds, tests and packages BREED LAB for Windows (VST3 + Standalone) and macOS (VST3 + AU + Standalone).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast path for testing: only the Windows plugin + installer, published to one fixed download link
  # https://github.com/txcjournal-byte/KEYS-KILLA/releases/download/test/KEYS-KILLA-Setup-Windows.exe
  windows-quick:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: build
          key: win-quick-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: win-quick-${{ hashFiles('CMakeLists.txt') }}-

      - name: Configure
        run: cmake -B build -A x64 -DKK_BUILD_TESTS=OFF

      - name: Build plugin
        run: cmake --build build --config Release --parallel --target KeysKilla_VST3 KeysKilla_Standalone

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(KEYS_KILLA VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\win\keyskilla.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish test build (fixed link)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem build\installer\*.exe | Select-Object -First 1).FullName out\KEYS-KILLA-Setup-Windows.exe
          Compress-Archive -Path "build\KeysKilla_artefacts\Release\VST3\BREED LAB.vst3" -DestinationPath out\KEYS-KILLA-VST3-Windows.zip -Force
          $notes = "Latest test build`n`nCommit: ${{ github.sha }}`nBranch: ${{ github.ref_name }}`nBuilt: $(Get-Date -Format u)"
          gh release view test *> $null
          if ($LASTEXITCODE -ne 0) { gh release create test --prerelease --title "BREED LAB - latest test build" --notes $notes --target ${{ github.sha }} }
          else { gh release edit test --notes $notes }
          gh release upload test out\KEYS-KILLA-Setup-Windows.exe out\KEYS-KILLA-VST3-Windows.zip --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Render + unit tests (all presets)
        shell: pwsh
        run: |
          & build\KeysKillaTests_artefacts\Release\KeysKillaTests.exe
          $code = $LASTEXITCODE
          Write-Host ("test exit code: {0} (0x{1:X8})" -f $code, $code)
          exit $code

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          & .\pluginval\pluginval.exe --strictness-level 10 --verbose --output-dir pluginval-logs --validate "build\KeysKilla_artefacts\Release\VST3\BREED LAB.vst3" 2>&1 | ForEach-Object {
            if ($_ -is [System.Management.Automation.ErrorRecord]) { "[stderr] $($_.ToString())" } else { "$_" }
          }
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host ("pluginval exit code: {0} (0x{1:X8})" -f $code, $code)
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001, 1026 } -MaxEvents 6 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message
            Get-Content "$env:TEMP\pluginval_crash.txt" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Crash dump analysis (only when pluginval failed)
        if: failure()
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile procdump.zip
          Expand-Archive procdump.zip -DestinationPath procdump
          New-Item -ItemType Directory -Force dumps | Out-Null
          for ($run = 1; $run -le 3; $run++) {
            .\procdump\procdump64.exe -accepteula -ma -e 1 -f C0000005 -f C0000409 -f C00000FD -f C0000374 -x dumps .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --validate "build\KeysKilla_artefacts\Release\VST3\BREED LAB.vst3" | Select-String -Pattern "Starting tests|Exception|Dump|FAILED|SUCCESS"
            if (Get-ChildItem dumps\*.dmp -ErrorAction SilentlyContinue) { break }
          }
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          $sym = (Resolve-Path "build\KeysKilla_artefacts\Release\VST3\BREED LAB.vst3\Contents\x86_64-win").Path
          foreach ($d in Get-ChildItem dumps\*.dmp) {
            Write-Host "=== DUMP $($d.Name) ==="
            & $cdb -z $d.FullName -y "$sym;srv*" -c ".ecxr;kb 60;.echo ===ALL THREADS===;~*kb 20;q" | Select-Object -Last 250
          }
          exit 0

      - name: Installer (Inno Setup)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(KEYS_KILLA VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\win\keyskilla.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload VST3 + Standalone
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: KEYS-KILLA-Windows-VST3
          path: |
            build/KeysKilla_artefacts/Release/VST3/
            build/KeysKilla_artefacts/Release/Standalone/

      - name: Upload installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: KEYS-KILLA-Windows-Installer
          path: build/installer/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure (universal)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Render + unit tests (all presets)
        run: ./build/KeysKillaTests_artefacts/Release/KeysKillaTests

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/KeysKilla_artefacts/Release/AU/BREED LAB.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumu Kkey Kila

      - name: pluginval (strictness 10)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --validate "build/KeysKilla_artefacts/Release/VST3/BREED LAB.vst3"

      - name: Installer (pkg; signed + notarized when secrets exist)
        if: ${{ !cancelled() }}
        env:
          MAC_APP_SIGN_ID: ${{ secrets.MAC_APP_SIGN_ID }}
          MAC_INST_SIGN_ID: ${{ secrets.MAC_INST_SIGN_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          VERSION=$(sed -n 's/project(KEYS_KILLA VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          installer/mac/build_pkg.sh "$VERSION"

      - name: Upload plugins
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: KEYS-KILLA-macOS
          path: |
            build/KeysKilla_artefacts/Release/VST3/
            build/KeysKilla_artefacts/Release/AU/
            build/KeysKilla_artefacts/Release/Standalone/

      - name: Upload installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: KEYS-KILLA-macOS-Installer
          path: build/installer/*.pkg
