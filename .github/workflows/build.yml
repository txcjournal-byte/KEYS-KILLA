name: build

# Builds, tests and packages EVOLVE for Windows (VST3 + Standalone) and macOS (VST3 + AU + Standalone),
# and the separate product CHROME VAULT by TrapWin (steps marked "CHROME VAULT", docs/CHROME_VAULT_INSTALL.md).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast path for testing: only the Windows plugin + installer, published to one fixed download link
  # https://github.com/txcjournal-byte/KEYS-KILLA/releases/download/test/KEYS-KILLA-Setup-Windows.exe
  windows-quick:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: build
          key: win-quick-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: win-quick-${{ hashFiles('CMakeLists.txt') }}-

      - name: Configure
        # KK_BUILD_TESTS=ON only defines the test targets; only the targets named in the build steps are compiled
        # (CHROME VAULT below builds VaultTests to test the sample library)
        run: cmake -B build -A x64 -DKK_BUILD_TESTS=ON

      - name: Build plugin
        run: cmake --build build --config Release --parallel --target KeysKilla_VST3 KeysKilla_Standalone EvolveFX_VST3

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(KEYS_KILLA VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\win\keyskilla.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish test build (fixed link)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem build\installer\*.exe | Select-Object -First 1).FullName out\KEYS-KILLA-Setup-Windows.exe
          Compress-Archive -Path "build\KeysKilla_artefacts\Release\VST3\EVOLVE.vst3","build\EvolveFX_artefacts\Release\VST3\EVOLVE FX PRO.vst3" -DestinationPath out\KEYS-KILLA-VST3-Windows.zip -Force
          $notes = "Latest test build`n`nCommit: ${{ github.sha }}`nBranch: ${{ github.ref_name }}`nBuilt: $(Get-Date -Format u)"
          gh release view test *> $null
          if ($LASTEXITCODE -ne 0) { gh release create test --prerelease --title "EVOLVE - latest test build" --notes $notes --target ${{ github.sha }} }
          else { gh release edit test --notes $notes }
          gh release upload test out\KEYS-KILLA-Setup-Windows.exe out\KEYS-KILLA-VST3-Windows.zip --clobber

      # --- CHROME VAULT (separate product, TrapWin) ---------------------------------------------------------------
      # Built after EVOLVE is published, so a CHROME VAULT problem never holds back the EVOLVE test build.
      # https://github.com/txcjournal-byte/KEYS-KILLA/releases/download/test/CHROME-VAULT-Setup-Windows.exe
      # https://github.com/txcjournal-byte/KEYS-KILLA/releases/download/test/CHROME-VAULT-VST3-Windows.zip
      # https://github.com/txcjournal-byte/KEYS-KILLA/releases/download/test/CHROME-VAULT-Library.zip
      #   (or CHROME-VAULT-Library-part1-of-N.zip ... when the library is larger than 1.9 GB)
      # The sample library lives on the orphan branch "vault-library" (Library/library.json + Library/audio/**.ogg,
      # tools/vault/package_library.py). Without that branch everything below still runs: tests skip the real-library
      # checks and the installer is plugin-only.
      - name: CHROME VAULT library (look for the vault-library branch)
        id: cv_lib
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin vault-library > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CHROME VAULT::no vault-library branch yet - tests run without the sample library, the installer is plugin-only"
          fi

      - name: CHROME VAULT library checkout
        if: steps.cv_lib.outputs.found == 'true'
        uses: actions/checkout@v5
        with:
          ref: vault-library
          path: vault-library
          fetch-depth: 1
          persist-credentials: false

      - name: CHROME VAULT library tools (Python)
        if: steps.cv_lib.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: CHROME VAULT library check
        if: steps.cv_lib.outputs.found == 'true'
        shell: pwsh
        run: |
          $lib = & python tools\vault\package_library.py find vault-library
          if ($LASTEXITCODE -ne 0 -or -not $lib) { Write-Host "::error::the vault-library branch holds no library.json"; exit 1 }
          & python tools\vault\package_library.py check $lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # absolute path: VaultTests (CHROME_VAULT_LIBRARY) + the installer (CV_LIBRARY_DIR -> /DLibraryDir)
          "CHROME_VAULT_LIBRARY=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CV_LIBRARY_DIR=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build CHROME VAULT
        run: cmake --build build --config Release --parallel --target ChromeVault_VST3 ChromeVault_Standalone VaultTests

      - name: CHROME VAULT tests (with the sample library when present)
        shell: pwsh
        run: |
          Write-Host ("CHROME_VAULT_LIBRARY = '{0}'" -f $env:CHROME_VAULT_LIBRARY)
          & build\VaultTests_artefacts\Release\VaultTests.exe
          $code = $LASTEXITCODE
          Write-Host ("VaultTests exit code: {0} (0x{1:X8})" -f $code, $code)
          exit $code

      - name: CHROME VAULT installer
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'set\(CV_VERSION "([0-9.]+)"\)').Matches[0].Groups[1].Value
          $limit = 2000000000   # one GitHub release asset must stay below 2 GiB; keep a margin
          Remove-Item -Recurse -Force build\installer-vault -ErrorAction SilentlyContinue
          $iscc = @("/DAppVersion=$version")
          if ($env:CV_LIBRARY_DIR) {
            # OggVorbis hardly compresses: a library close to the limit cannot fit, fail before a long compression
            $libBytes = [int64](& python tools\vault\package_library.py size $env:CV_LIBRARY_DIR)
            Write-Host ("sample library: {0:N0} bytes" -f $libBytes)
            if ($libBytes -ge $limit) { Write-Host "::error::the sample library ($libBytes bytes) does not fit a < 2 GB installer"; exit 1 }
            $iscc += "/DLibraryDir=$env:CV_LIBRARY_DIR"
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @iscc installer\win\chromevault.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = Get-ChildItem build\installer-vault\CHROME-VAULT-*.exe | Select-Object -First 1
          Write-Host ("installer: {0} ({1:N0} bytes)" -f $exe.Name, $exe.Length)
          if ($exe.Length -ge $limit) { Write-Host "::error::the installer is $($exe.Length) bytes - it must stay below 2 GB (GitHub release asset)"; exit 1 }

      - name: Publish CHROME VAULT test build (fixed link)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force out, out\cv-stage, out\cv-lib | Out-Null
          # moved, not copied: build\ is cached and must not carry a 2 GB installer
          Move-Item (Get-ChildItem build\installer-vault\CHROME-VAULT-*.exe | Select-Object -First 1).FullName out\CHROME-VAULT-Setup-Windows.exe -Force
          # zip root = "CHROME VAULT.vst3" (debug symbols / linker files left out)
          Copy-Item -LiteralPath "build\ChromeVault_artefacts\Release\VST3\CHROME VAULT.vst3" -Destination out\cv-stage -Recurse -Force
          Get-ChildItem out\cv-stage -Recurse -File -Include *.pdb,*.ilk,*.exp,*.lib | Remove-Item -Force
          Compress-Archive -LiteralPath "out\cv-stage\CHROME VAULT.vst3" -DestinationPath out\CHROME-VAULT-VST3-Windows.zip -Force
          # the library for manual installs: CHROME-VAULT-Library.zip, or self-contained parts when larger than 1.9 GB
          $libZips = @()
          if ($env:CV_LIBRARY_DIR) {
            $libZips = @(& python tools\vault\package_library.py zip $env:CV_LIBRARY_DIR out\cv-lib --name CHROME-VAULT-Library --max-part-bytes 1900000000)
            if ($LASTEXITCODE -ne 0 -or $libZips.Count -eq 0) { exit 1 }
          }
          gh release view test *> $null
          if ($LASTEXITCODE -ne 0) { gh release create test --prerelease --title "EVOLVE - latest test build" --notes "Latest test build" --target ${{ github.sha }} }
          gh release upload test out\CHROME-VAULT-Setup-Windows.exe out\CHROME-VAULT-VST3-Windows.zip --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($libZips.Count -gt 0) {
            gh release upload test ($libZips | ForEach-Object { "out\cv-lib\$_" }) --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # drop library zips of an earlier layout (one zip <-> parts) so the release never mixes them
            $old = @(gh release view test --json assets --jq '.assets[].name') | Where-Object { $_ -like 'CHROME-VAULT-Library*' -and $libZips -notcontains $_ }
            foreach ($name in $old) { gh release delete-asset test $name --yes }
          }

      - name: CHROME VAULT cleanup (keep the build cache small)
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force build\installer-vault, out\cv-lib, out\CHROME-VAULT-Setup-Windows.exe -ErrorAction SilentlyContinue
      # --- end CHROME VAULT ---------------------------------------------------------------------------------------

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Render + unit tests (all presets)
        shell: pwsh
        run: |
          & build\KeysKillaTests_artefacts\Release\KeysKillaTests.exe
          $code = $LASTEXITCODE
          Write-Host ("test exit code: {0} (0x{1:X8})" -f $code, $code)
          exit $code

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          & .\pluginval\pluginval.exe --strictness-level 10 --verbose --output-dir pluginval-logs --validate "build\KeysKilla_artefacts\Release\VST3\EVOLVE.vst3" 2>&1 | ForEach-Object {
            if ($_ -is [System.Management.Automation.ErrorRecord]) { "[stderr] $($_.ToString())" } else { "$_" }
          }
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host ("pluginval exit code: {0} (0x{1:X8})" -f $code, $code)
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001, 1026 } -MaxEvents 6 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message
            Get-Content "$env:TEMP\pluginval_crash.txt" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Crash dump analysis (only when pluginval failed)
        if: failure()
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile procdump.zip
          Expand-Archive procdump.zip -DestinationPath procdump
          New-Item -ItemType Directory -Force dumps | Out-Null
          for ($run = 1; $run -le 3; $run++) {
            .\procdump\procdump64.exe -accepteula -ma -e 1 -f C0000005 -f C0000409 -f C00000FD -f C0000374 -x dumps .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --validate "build\KeysKilla_artefacts\Release\VST3\EVOLVE.vst3" | Select-String -Pattern "Starting tests|Exception|Dump|FAILED|SUCCESS"
            if (Get-ChildItem dumps\*.dmp -ErrorAction SilentlyContinue) { break }
          }
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          $sym = (Resolve-Path "build\KeysKilla_artefacts\Release\VST3\EVOLVE.vst3\Contents\x86_64-win").Path
          foreach ($d in Get-ChildItem dumps\*.dmp) {
            Write-Host "=== DUMP $($d.Name) ==="
            & $cdb -z $d.FullName -y "$sym;srv*" -c ".ecxr;kb 60;.echo ===ALL THREADS===;~*kb 20;q" | Select-Object -Last 250
          }
          exit 0

      - name: Installer (Inno Setup)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(KEYS_KILLA VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\win\keyskilla.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload VST3 + Standalone
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: KEYS-KILLA-Windows-VST3
          path: |
            build/KeysKilla_artefacts/Release/VST3/
            build/KeysKilla_artefacts/Release/Standalone/

      - name: Upload installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: KEYS-KILLA-Windows-Installer
          path: build/installer/*.exe

      # --- CHROME VAULT (separate product, TrapWin) ---------------------------------------------------------------
      # The steps above already built every target (ChromeVault_VST3 / _Standalone / VaultTests included).
      # They run even when an EVOLVE step failed, so both products always report their own result.
      - name: CHROME VAULT tests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & build\VaultTests_artefacts\Release\VaultTests.exe
          $code = $LASTEXITCODE
          Write-Host ("VaultTests exit code: {0} (0x{1:X8})" -f $code, $code)
          exit $code

      - name: CHROME VAULT pluginval (strictness 10)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Test-Path .\pluginval\pluginval.exe)) {
            Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
            Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          }
          & .\pluginval\pluginval.exe --strictness-level 10 --verbose --output-dir pluginval-logs-vault --validate "build\ChromeVault_artefacts\Release\VST3\CHROME VAULT.vst3" 2>&1 | ForEach-Object {
            if ($_ -is [System.Management.Automation.ErrorRecord]) { "[stderr] $($_.ToString())" } else { "$_" }
          }
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host ("pluginval exit code: {0} (0x{1:X8})" -f $code, $code)
            Get-Content "$env:TEMP\pluginval_crash.txt" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: CHROME VAULT installer (Inno Setup)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'set\(CV_VERSION "([0-9.]+)"\)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\win\chromevault.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload CHROME VAULT VST3 + Standalone
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: CHROME-VAULT-Windows-VST3
          path: |
            build/ChromeVault_artefacts/Release/VST3/
            build/ChromeVault_artefacts/Release/Standalone/

      - name: Upload CHROME VAULT installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: CHROME-VAULT-Windows-Installer
          path: build/installer-vault/*.exe
      # --- end CHROME VAULT ---------------------------------------------------------------------------------------

  macos:
    runs-on: macos-latest
    permissions:
      contents: write   # CHROME VAULT publishes CHROME-VAULT-Mac.zip to the "test" release (not on pull requests)
    steps:
      - uses: actions/checkout@v5

      - name: Configure (universal)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Render + unit tests (all presets)
        run: ./build/KeysKillaTests_artefacts/Release/KeysKillaTests

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/KeysKilla_artefacts/Release/AU/EVOLVE.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumu Kkey Kila

      - name: pluginval (strictness 10)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --validate "build/KeysKilla_artefacts/Release/VST3/EVOLVE.vst3"

      - name: Installer (pkg; signed + notarized when secrets exist)
        if: ${{ !cancelled() }}
        env:
          MAC_APP_SIGN_ID: ${{ secrets.MAC_APP_SIGN_ID }}
          MAC_INST_SIGN_ID: ${{ secrets.MAC_INST_SIGN_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          VERSION=$(sed -n 's/project(KEYS_KILLA VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          installer/mac/build_pkg.sh "$VERSION"

      - name: Upload plugins
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: KEYS-KILLA-macOS
          path: |
            build/KeysKilla_artefacts/Release/VST3/
            build/KeysKilla_artefacts/Release/AU/
            build/KeysKilla_artefacts/Release/Standalone/

      - name: Upload installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: KEYS-KILLA-macOS-Installer
          path: build/installer/*.pkg

      # --- CHROME VAULT (separate product, TrapWin) ---------------------------------------------------------------
      # "Build" above already built every target universal (arm64 + x86_64): ChromeVault VST3 / AU / Standalone + VaultTests.
      # These steps run even when an EVOLVE step failed, so both products always report their own result.
      # https://github.com/txcjournal-byte/KEYS-KILLA/releases/download/test/CHROME-VAULT-Mac.zip
      # https://github.com/txcjournal-byte/KEYS-KILLA/releases/download/test/CHROME-VAULT-Setup-Mac.pkg
      # The sample library comes from the orphan branch "vault-library" (see windows-quick). Without that branch the
      # tests skip the real-library checks and the pkg is plugin-only. The library zip is published by windows-quick.
      - name: CHROME VAULT library (look for the vault-library branch)
        id: cv_lib
        if: ${{ !cancelled() }}
        run: |
          if git ls-remote --exit-code --heads origin vault-library > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CHROME VAULT::no vault-library branch yet - tests run without the sample library, the pkg is plugin-only"
          fi

      - name: CHROME VAULT library checkout
        if: ${{ !cancelled() && steps.cv_lib.outputs.found == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: vault-library
          path: vault-library
          fetch-depth: 1
          persist-credentials: false

      - name: CHROME VAULT library check
        id: cv_libcheck
        if: ${{ !cancelled() && steps.cv_lib.outputs.found == 'true' }}
        run: |
          LIB=$(python3 tools/vault/package_library.py find vault-library) || { echo "::error::the vault-library branch holds no library.json"; exit 1; }
          python3 tools/vault/package_library.py check "$LIB"
          # absolute path: VaultTests (CHROME_VAULT_LIBRARY) + build_vault_pkg.sh (CV_LIBRARY_DIR)
          echo "CHROME_VAULT_LIBRARY=$LIB" >> "$GITHUB_ENV"
          echo "CV_LIBRARY_DIR=$LIB" >> "$GITHUB_ENV"

      - name: CHROME VAULT tests
        id: cv_tests
        if: ${{ !cancelled() }}
        run: |
          echo "CHROME_VAULT_LIBRARY = '${CHROME_VAULT_LIBRARY:-}'"
          ./build/VaultTests_artefacts/Release/VaultTests
          lipo -info "build/ChromeVault_artefacts/Release/VST3/CHROME VAULT.vst3/Contents/MacOS/CHROME VAULT"
          lipo -info "build/ChromeVault_artefacts/Release/AU/CHROME VAULT.component/Contents/MacOS/CHROME VAULT"

      - name: CHROME VAULT auval
        id: cv_auval
        if: ${{ !cancelled() }}
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/"CHROME VAULT.component"
          cp -R "build/ChromeVault_artefacts/Release/AU/CHROME VAULT.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumu Cvlt Trpw

      - name: CHROME VAULT pluginval (strictness 10)
        id: cv_pluginval
        if: ${{ !cancelled() }}
        run: |
          if [ ! -x ./pluginval.app/Contents/MacOS/pluginval ]; then
            curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q -o pluginval.zip
          fi
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --validate "build/ChromeVault_artefacts/Release/VST3/CHROME VAULT.vst3"

      - name: CHROME VAULT installer (pkg; signed + notarized when secrets exist)
        id: cv_pkg
        if: ${{ !cancelled() }}
        env:
          MAC_APP_SIGN_ID: ${{ secrets.MAC_APP_SIGN_ID }}
          MAC_INST_SIGN_ID: ${{ secrets.MAC_INST_SIGN_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          VERSION=$(sed -n 's/^set(CV_VERSION "\([0-9.]*\)").*/\1/p' CMakeLists.txt | head -n 1)
          installer/mac/build_vault_pkg.sh "$VERSION"

      - name: CHROME VAULT zip (VST3 + AU)
        id: cv_zip
        if: ${{ !cancelled() }}
        run: |
          # take the bundles the pkg step staged (code-signed when MAC_APP_SIGN_ID exists), else the raw build output
          if [ -d "build/pkgroot-vault/Library/Audio/Plug-Ins/VST3/CHROME VAULT.vst3" ]; then
            VST3="build/pkgroot-vault/Library/Audio/Plug-Ins/VST3/CHROME VAULT.vst3"
            AU="build/pkgroot-vault/Library/Audio/Plug-Ins/Components/CHROME VAULT.component"
          else
            VST3="build/ChromeVault_artefacts/Release/VST3/CHROME VAULT.vst3"
            AU="build/ChromeVault_artefacts/Release/AU/CHROME VAULT.component"
          fi
          rm -rf build/cv-zip out-vault && mkdir -p build/cv-zip out-vault
          ditto "$VST3" "build/cv-zip/CHROME VAULT.vst3"
          ditto "$AU" "build/cv-zip/CHROME VAULT.component"
          (cd build/cv-zip && zip -qry ../../out-vault/CHROME-VAULT-Mac.zip "CHROME VAULT.vst3" "CHROME VAULT.component")
          cp build/installer-vault/CHROME-VAULT-*-macOS.pkg out-vault/CHROME-VAULT-Setup-Mac.pkg 2>/dev/null || echo "no pkg (installer step failed) - zip only"
          unzip -l out-vault/CHROME-VAULT-Mac.zip | tail -n 3

      - name: Upload CHROME VAULT plugins
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: CHROME-VAULT-macOS
          path: |
            build/ChromeVault_artefacts/Release/VST3/
            build/ChromeVault_artefacts/Release/AU/
            build/ChromeVault_artefacts/Release/Standalone/

      - name: Upload CHROME VAULT installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: CHROME-VAULT-macOS-Installer
          path: build/installer-vault/*.pkg
          retention-days: 7   # up to ~2 GB with the sample library; the test release keeps the latest one anyway

      - name: Publish CHROME VAULT test build (fixed link)
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.cv_tests.outcome == 'success' && steps.cv_auval.outcome == 'success' && steps.cv_pluginval.outcome == 'success' && steps.cv_zip.outcome == 'success' && steps.cv_libcheck.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # windows-quick normally creates the release first; create it here only if it is still missing
          if ! gh release view test > /dev/null 2>&1; then
            gh release create test --prerelease --title "EVOLVE - latest test build" --notes "Latest test build" --target "${{ github.sha }}" \
              || gh release view test > /dev/null
          fi
          gh release upload test out-vault/CHROME-VAULT-Mac.zip $( [ -f out-vault/CHROME-VAULT-Setup-Mac.pkg ] && echo out-vault/CHROME-VAULT-Setup-Mac.pkg ) --clobber
      # --- end CHROME VAULT ---------------------------------------------------------------------------------------
