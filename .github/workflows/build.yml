name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DKK_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Render test (all presets)
        run: build\KeysKillaTests_artefacts\Release\KeysKillaTests.exe
      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests --validate "build\KeysKilla_artefacts\Release\VST3\KEYS KILLA.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: KEYS-KILLA-Windows-VST3
          path: |
            build/KeysKilla_artefacts/Release/VST3/
            build/KeysKilla_artefacts/Release/Standalone/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DKK_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --target KeysKilla_VST3 KeysKilla_AU KeysKilla_Standalone -- -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: KEYS-KILLA-macOS-unsigned
          path: |
            build/KeysKilla_artefacts/Release/VST3/
            build/KeysKilla_artefacts/Release/AU/
            build/KeysKilla_artefacts/Release/Standalone/
