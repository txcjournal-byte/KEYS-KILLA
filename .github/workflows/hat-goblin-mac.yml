name: HAT GOBLIN mac signed

# Signed + notarized macOS build of HAT GOBLIN (source: txcjournal-byte/rolls-killa), using this repo's
# Developer ID secrets. Lives on its own orphan branch so the KEYS-KILLA / EVOLVE builds are untouched.
# Output (release "hat-goblin" of this repo):
#   HAT-GOBLIN-Setup-Mac.pkg       signed + notarized installer (VST3 + AU + Standalone, universal)
#   HAT-GOBLIN-1.0.0-macOS.zip     what the TrapWin shop delivers (pkg + install notes)
on:
  push:
    branches: [hat-goblin-mac]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout HAT GOBLIN source
        uses: actions/checkout@v5
        with:
          repository: txcjournal-byte/rolls-killa
          ref: main
          persist-credentials: false

      - name: Configure (universal)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target HatGoblin_VST3 HatGoblin_AU HatGoblin_Standalone HatGoblinTests

      - name: Render tests
        run: ./build/HatGoblinTests_artefacts/Release/HatGoblinTests

      - name: Mac signing setup
        env:
          MAC_CERT_APP_P12: ${{ secrets.MAC_CERT_APP_P12 }}
          MAC_CERT_INSTALLER_P12: ${{ secrets.MAC_CERT_INSTALLER_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: installer/mac/setup_signing.sh

      - name: Require signing identities
        run: |
          [ -n "${MAC_APP_SIGN_ID:-}" ] || { echo "::error::no Developer ID Application identity"; exit 1; }
          [ -n "${MAC_INST_SIGN_ID:-}" ] || { echo "::error::no Developer ID Installer identity"; exit 1; }
          [ -n "${NOTARY_KEY_PATH:-}" ] || { echo "::error::no notarization key"; exit 1; }

      - name: Installer (signed + notarized pkg)
        run: |
          VERSION=$(sed -n 's/project(HAT_GOBLIN VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          installer/mac/build_pkg.sh "$VERSION"

      - name: Verify
        run: |
          PKG=$(ls build/installer/HAT-GOBLIN-*-macOS.pkg | head -n 1)
          pkgutil --check-signature "$PKG"
          spctl --assess --type install -vv "$PKG"
          xcrun stapler validate "$PKG"
          codesign --verify --strict --verbose=2 "build/pkgroot/Library/Audio/Plug-Ins/VST3/HAT GOBLIN.vst3"
          codesign --verify --strict --verbose=2 "build/pkgroot/Library/Audio/Plug-Ins/Components/HAT GOBLIN.component"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/shop
          cp build/installer/HAT-GOBLIN-*-macOS.pkg out/HAT-GOBLIN-Setup-Mac.pkg
          cp out/HAT-GOBLIN-Setup-Mac.pkg "out/shop/HAT GOBLIN Installer.pkg"
          cat > "out/shop/INSTALL - read me.txt" <<TXT
          HAT GOBLIN $VERSION by TrapWin - macOS (Apple Silicon + Intel)

          1. Double-click "HAT GOBLIN Installer.pkg" and follow the steps.
          2. It installs:
             VST3  -> /Library/Audio/Plug-Ins/VST3/HAT GOBLIN.vst3
             AU    -> /Library/Audio/Plug-Ins/Components/HAT GOBLIN.component
             App   -> /Applications/HAT GOBLIN.app
          3. Open your DAW, rescan plugins, load HAT GOBLIN as an instrument.

          Keys: C3-C4 rolls (1/2 to 1/256, triplets on black keys), C2-B2 patterns,
          C1/D1 pitch down/up, E1 latch. Drop any WAV on the plugin to roll your own hat.
          Drag "DRAG MIDI" into your piano roll to get the roll as MIDI notes.

          Support: trapwin.com
          TXT
          (cd out/shop && ditto -c -k . "../HAT-GOBLIN-$VERSION-macOS.zip")
          if ! gh release view hat-goblin -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create hat-goblin -R "$GITHUB_REPOSITORY" --prerelease --title "HAT GOBLIN - signed macOS build" --notes "Signed + notarized macOS build of HAT GOBLIN (source: txcjournal-byte/rolls-killa)" --target "$GITHUB_SHA"
          fi
          gh release upload hat-goblin -R "$GITHUB_REPOSITORY" out/HAT-GOBLIN-Setup-Mac.pkg "out/HAT-GOBLIN-$VERSION-macOS.zip" --clobber
